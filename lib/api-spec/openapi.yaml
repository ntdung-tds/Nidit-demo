components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string }
    PageQuery:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100 }
    LangQuery:
      name: lang
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ContentLanguage" }

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ------------------------------------------------------------ enums
    UserRole:
      type: string
      enum: [admin, editor, reviewer]
    ContentLanguage:
      type: string
      enum: [vi, en]
    MenuLocation:
      type: string
      enum: [main, footer, links]
    PageStatus:
      type: string
      enum: [draft, published]
    ArticleStatus:
      type: string
      enum: [draft, pending, changes_requested, approved, scheduled, published, unpublished]
    ArticleOrigin:
      type: string
      enum: [manual, crawler]
    TransitionAction:
      type: string
      enum: [submit, request_changes, approve, publish, unpublish, revert_to_draft]
    ProjectStatus:
      type: string
      enum: [proposed, ongoing, completed]
    PublicationType:
      type: string
      enum: [journal, conference, book, report, patent]
    AccessLevel:
      type: string
      enum: [open, registered, restricted]
    AccessMethodType:
      type: string
      enum: [link, api, object_storage]
    DocumentGroup:
      type: string
      enum: [legal, direction, guidance, report, standard, form]
    DocumentSort:
      type: string
      enum: [newest, oldest, downloads]
    AlbumType:
      type: string
      enum: [photo, video]
    OrgUnitType:
      type: string
      enum: [council, office, department, center]
    SearchType:
      type: string
      enum: [article, document, project, publication, dataset, service, page]
    InquiryType:
      type: string
      enum: [contact, dataset_access, evaluation_request]
    InquiryStatus:
      type: string
      enum: [new, processing, resolved, rejected]
    CrawlItemStatus:
      type: string
      enum: [pending, imported, rejected]
    AiTask:
      type: string
      enum: [titles, summary, keywords, rewrite, seo, proofread]
    MediaType:
      type: string
      enum: [image, video, file]

    # ------------------------------------------------------------ shared small types
    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }
    LabelCount:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    FacetCount:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }

    # ------------------------------------------------------------ users / auth
    User:
      type: object
      required: [id, fullName, email, role, title, unit, isActive, lastLoginAt, createdAt]
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string, description: Chức danh }
        unit: { type: string, description: Đơn vị công tác }
        isActive: { type: boolean }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    UserInput:
      type: object
      required: [fullName, email, role]
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string }
        unit: { type: string }
    UserUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string }
        unit: { type: string }
        isActive: { type: boolean }
    LoginInput:
      type: object
      required: [userId]
      properties:
        userId: { type: integer }
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    # ------------------------------------------------------------ site
    SiteSettings:
      type: object
      required:
        [siteName, siteNameEn, shortName, parentOrg, parentOrgEn, parentPortalUrl, address, addressEn, phone, email,
         responsiblePerson, responsibleTitle, copyrightNote, workingHours, mapEmbedUrl, facebookUrl, youtubeUrl,
         seoTitle, seoDescription, seoKeywords, demoNotice, updatedAt]
      properties:
        siteName: { type: string }
        siteNameEn: { type: string }
        shortName: { type: string }
        parentOrg: { type: string, description: Cơ quan chủ quản }
        parentOrgEn: { type: string }
        parentPortalUrl: { type: string }
        address: { type: string }
        addressEn: { type: string }
        phone: { type: string }
        email: { type: string }
        responsiblePerson: { type: string, description: Người chịu trách nhiệm nội dung }
        responsibleTitle: { type: string }
        copyrightNote: { type: string }
        workingHours: { type: string }
        mapEmbedUrl: { type: ["string", "null"] }
        facebookUrl: { type: ["string", "null"] }
        youtubeUrl: { type: ["string", "null"] }
        seoTitle: { type: string }
        seoDescription: { type: string }
        seoKeywords:
          type: array
          items: { type: string }
        demoNotice: { type: ["string", "null"], description: Dòng thông báo dữ liệu minh họa; null để ẩn }
        updatedAt: { type: string, format: date-time }
    SiteSettingsUpdate:
      type: object
      properties:
        siteName: { type: string, minLength: 1 }
        siteNameEn: { type: string }
        shortName: { type: string }
        parentOrg: { type: string }
        parentOrgEn: { type: string }
        parentPortalUrl: { type: string }
        address: { type: string }
        addressEn: { type: string }
        phone: { type: string }
        email: { type: string }
        responsiblePerson: { type: string }
        responsibleTitle: { type: string }
        copyrightNote: { type: string }
        workingHours: { type: string }
        mapEmbedUrl: { type: ["string", "null"] }
        facebookUrl: { type: ["string", "null"] }
        youtubeUrl: { type: ["string", "null"] }
        seoTitle: { type: string }
        seoDescription: { type: string }
        seoKeywords:
          type: array
          items: { type: string }
        demoNotice: { type: ["string", "null"] }
    VisitInput:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1 }
        articleId: { type: ["integer", "null"] }
        referrer: { type: ["string", "null"] }
    VisitCounter:
      type: object
      required: [online, today, thisMonth, total]
      properties:
        online: { type: integer }
        today: { type: integer }
        thisMonth: { type: integer }
        total: { type: integer }

    # ------------------------------------------------------------ menu + categories
    MenuItem:
      type: object
      required: [id, label, labelEn, url, parentId, location, sortOrder, isVisible, openInNewTab]
      properties:
        id: { type: integer }
        label: { type: string }
        labelEn: { type: ["string", "null"] }
        url: { type: string }
        parentId: { type: ["integer", "null"] }
        location: { $ref: "#/components/schemas/MenuLocation" }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
        openInNewTab: { type: boolean }
    MenuItemInput:
      type: object
      required: [label, url, location]
      properties:
        label: { type: string, minLength: 1 }
        labelEn: { type: ["string", "null"] }
        url: { type: string, minLength: 1 }
        parentId: { type: ["integer", "null"] }
        location: { $ref: "#/components/schemas/MenuLocation" }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
        openInNewTab: { type: boolean }
    MenuItemUpdate:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        labelEn: { type: ["string", "null"] }
        url: { type: string, minLength: 1 }
        parentId: { type: ["integer", "null"] }
        location: { $ref: "#/components/schemas/MenuLocation" }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
        openInNewTab: { type: boolean }
    Category:
      type: object
      required: [id, name, nameEn, slug, parentId, description, sortOrder, isVisible, articleCount]
      properties:
        id: { type: integer }
        name: { type: string }
        nameEn: { type: ["string", "null"] }
        slug: { type: string }
        parentId: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
        articleCount: { type: integer, description: Số bài đã xuất bản }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        nameEn: { type: ["string", "null"] }
        slug: { type: string, description: Bỏ trống để tự sinh từ tên }
        parentId: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
    CategoryUpdate:
      type: object
