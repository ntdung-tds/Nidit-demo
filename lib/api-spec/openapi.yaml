openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API cho Trang thông tin điện tử Viện Công nghệ số và Chuyển đổi số quốc gia (NIDIT) - bản trình diễn
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Đăng nhập tài khoản demo
  - name: site
    description: Cấu hình trang, menu, thống kê truy cập
  - name: content
    description: Tin bài, chuyên mục, trang tĩnh
  - name: sections
    description: Các chuyên trang (lĩnh vực, đề tài, công bố, dữ liệu, đánh giá, văn bản, thư viện)
  - name: admin
    description: Quản trị nội dung (CMS)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------------------------------------------------------- auth
  /auth/demo-accounts:
    get:
      operationId: listDemoAccounts
      tags: [auth]
      summary: Danh sách tài khoản demo (quản trị / biên tập / duyệt)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Đăng nhập bằng tài khoản demo, trả về token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400":
          description: Invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Người dùng hiện tại (theo token)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Chưa đăng nhập
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Đã đăng xuất

  # ---------------------------------------------------------------- site
  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [site]
      summary: Thông tin định danh trang (header/footer, SEO mặc định)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSettings" }
  /admin/site-settings:
    patch:
      operationId: updateSiteSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteSettingsUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSettings" }
  /visit-counter:
    get:
      operationId: getVisitCounter
      tags: [site]
      summary: Bộ đếm truy cập (đang online, hôm nay, tháng này, tổng)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitCounter" }
  /track:
    post:
      operationId: trackVisit
      tags: [site]
      summary: Ghi nhận một lượt xem trang
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitInput" }
      responses:
        "204":
          description: Recorded
  /menu-items:
    get:
      operationId: listMenuItems
      tags: [site]
      parameters:
        - name: location
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MenuLocation" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItem" }
  /admin/menu-items:
    post:
      operationId: createMenuItem
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
  /admin/menu-items/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateMenuItem
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuItemUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
    delete:
      operationId: deleteMenuItem
      tags: [admin]
      responses:
        "204":
          description: Deleted

  # ---------------------------------------------------------------- categories
  /categories:
    get:
      operationId: listCategories
      tags: [content]
      summary: Toàn bộ chuyên mục (cây nhiều cấp qua parentId)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /admin/categories:
    post:
      operationId: createCategory
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
  /admin/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateCategory
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
    delete:
      operationId: deleteCategory
      tags: [admin]
      responses:
        "204":
          description: Deleted
        "400":
          description: Còn bài viết hoặc chuyên mục con
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------- static pages
  /pages/{slug}:
    parameters:
      - $ref: "#/components/parameters/SlugPath"
    get:
      operationId: getStaticPage
      tags: [content]
      summary: Trang tĩnh đã xuất bản theo slug
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaticPage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/pages:
    get:
      operationId: listAdminPages
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaticPage" }
    post:
      operationId: createStaticPage
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaticPageInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaticPage" }
  /admin/pages/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getAdminPage
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaticPage" }
    patch:
      operationId: updateStaticPage
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaticPageUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaticPage" }
    delete:
      operationId: deleteStaticPage
      tags: [admin]
      responses:
        "204":
          description: Deleted

  # ---------------------------------------------------------------- home + articles (public)
  /home:
    get:
      operationId: getHomeFeed
      tags: [content]
      summary: Dữ liệu tổng hợp cho trang chủ
      parameters:
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeFeed" }
  /articles:
    get:
      operationId: listArticles
      tags: [content]
      summary: Tin bài đã xuất bản (phân trang, lọc theo chuyên mục / thẻ / từ khóa)
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/LangQuery"
        - name: category
          in: query
          required: false
          description: Slug chuyên mục (bao gồm chuyên mục con)
          schema: { type: string }
        - name: tag
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticlePage" }
  /articles/popular:
    get:
      operationId: listPopularArticles
      tags: [content]
      summary: Tin đọc nhiều
      parameters:
        - $ref: "#/components/parameters/LangQuery"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArticleSummary" }
  /articles/{slug}:
    parameters:
      - $ref: "#/components/parameters/SlugPath"
    get:
      operationId: getArticle
      tags: [content]
      summary: Chi tiết tin bài đã xuất bản kèm tin liên quan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------- admin articles + workflow
  /admin/articles:
    get:
      operationId: listAdminArticles
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ArticleStatus" }
        - name: categoryId
          in: query
          required: false
          schema: { type: integer }
        - name: createdById
          in: query
          required: false
          schema: { type: integer }
        - name: origin
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ArticleOrigin" }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArticlePage" }
    post:
      operationId: createArticle
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArticle" }
  /admin/articles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getAdminArticle
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArticle" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: updateArticle
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArticle" }
        "403":
          description: Không có quyền
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteArticle
      tags: [admin]
      responses:
        "204":
          description: Deleted
  /admin/articles/{id}/transition:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: transitionArticle
      tags: [admin]
      summary: Chuyển trạng thái quy trình (gửi duyệt, yêu cầu sửa, phê duyệt, xuất bản/hẹn giờ, gỡ, về nháp)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleTransitionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminArticle" }
        "400":
          description: Chuyển trạng thái không hợp lệ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Không có quyền
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------- activity fields
  /fields:
    get:
      operationId: listFields
      tags: [sections]
      summary: Lĩnh vực hoạt động
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityField" }
  /fields/{slug}:
    parameters:
      - $ref: "#/components/parameters/SlugPath"
    get:
      operationId: getField
      tags: [sections]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------- projects
  /projects:
    get:
      operationId: listProjects
      tags: [sections]
      summary: Nghiên cứu - Đề tài - Dự án
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ProjectStatus" }
        - name: fieldId
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
  /projects/{slug}:
    parameters:
      - $ref: "#/components/parameters/SlugPath"
    get:
      operationId: getProject
      tags: [sections]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/projects:
    post:
      operationId: createProject
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /admin/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateProject
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      operationId: deleteProject
      tags: [admin]
      responses:
        "204":
          description: Deleted

  # ---------------------------------------------------------------- publications
  /publications:
    get:
      operationId: listPublications
      tags: [sections]
      summary: Công bố khoa học
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: type
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PublicationType" }
        - name: year
          in: query
          required: false
          schema: { type: integer }
        - name: fieldId
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationPage" }
  /admin/publications:
    post:
      operationId: createPublication
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
  /admin/publications/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updatePublication
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
    delete:
      operationId: deletePublication
      tags: [admin]
      responses:
        "204":
          description: Deleted

  # ---------------------------------------------------------------- datasets (AI data)
  /datasets:
    get:
      operationId: listDatasets
      tags: [sections]
      summary: Dữ liệu phục vụ AI
      parameters:
        - name: fieldId
          in: query
          required: false
          schema: { type: integer }
        - name: accessLevel
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AccessLevel" }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }
  /datasets/stats:
    get:
      operationId: getDatasetStats
      tags: [sections]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetStats" }
  /datasets/{slug}:
    parameters:
      - $ref: "#/components/parameters/SlugPath"
    get:
      operationId: getDataset
      tags: [sections]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /datasets/{id}/access:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: recordDatasetAccess
      tags: [sections]
      summary: Ghi nhận lượt truy cập dữ liệu mở và trả về đường dẫn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetAccessInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetAccessResult" }
        "403":
          description: Dữ liệu yêu cầu đăng ký
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/datasets:
    post:
      operationId: createDataset
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
  /admin/datasets/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateDataset
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
    delete:
      operationId: deleteDataset
      tags: [admin]
      responses:
        "204":
          description: Deleted

  # ---------------------------------------------------------------- evaluation services
  /evaluation-services:
    get:
      operationId: listEvaluationServices
      tags: [sections]
      summary: Dịch vụ đánh giá - thử nghiệm - kiểm định
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvaluationService" }
  /evaluation-services/{slug}:
    parameters:
      - $ref: "#/components/parameters/SlugPath"
    get:
      operationId: getEvaluationService
      tags: [sections]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationService" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------- documents
  /documents:
    get:
      operationId: listDocuments
      tags: [sections]
      summary: Văn bản - Tài liệu (lọc + phân trang + bộ đếm theo nhóm)
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: docGroup
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DocumentGroup" }
        - name: docType
          in: query
          required: false
          schema: { type: string }
        - name: issuer
          in: query
          required: false
          schema: { type: string }
        - name: year
          in: query
          required: false
          schema: { type: integer }
        - name: fieldId
          in: query
          required: false
          schema: { type: integer }
        - name: sort
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DocumentSort" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPage" }
  /documents/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getDocument
      tags: [sections]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetail" }
        "404":
