        pending: { type: integer }
        scheduled: { type: integer }
        documents: { type: integer }
        datasets: { type: integer }
        projects: { type: integer }
        publications: { type: integer }
        albums: { type: integer }
        inquiriesNew: { type: integer }
        crawlPending: { type: integer }
        users: { type: integer }
    DashboardSummary:
      type: object
      required: [totals, statusCounts, visits, pendingReview, myWork, scheduled, recentActivity, topArticles, crawlSources, recentInquiries]
      properties:
        totals: { $ref: "#/components/schemas/DashboardTotals" }
        statusCounts:
          type: array
          items: { $ref: "#/components/schemas/StatusCount" }
        visits:
          type: array
          description: 14 ngày gần nhất
          items: { $ref: "#/components/schemas/DailyVisit" }
        pendingReview:
          type: array
          items: { $ref: "#/components/schemas/AdminArticleSummary" }
        myWork:
          type: array
          description: Bài nháp / cần chỉnh sửa của người dùng hiện tại
          items: { $ref: "#/components/schemas/AdminArticleSummary" }
        scheduled:
          type: array
          items: { $ref: "#/components/schemas/AdminArticleSummary" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityLog" }
        topArticles:
          type: array
          items: { $ref: "#/components/schemas/ArticleViewCount" }
        crawlSources:
          type: array
          items: { $ref: "#/components/schemas/CrawlSource" }
        recentInquiries:
          type: array
          items: { $ref: "#/components/schemas/Inquiry" }

    # ------------------------------------------------------------ backups
    BackupTableCount:
      type: object
      required: [table, rows]
      properties:
        table: { type: string }
        rows: { type: integer }
    Backup:
      type: object
      required: [id, note, createdByName, createdAt, sizeBytes, tables]
      properties:
        id: { type: integer }
        note: { type: ["string", "null"] }
        createdByName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        sizeBytes: { type: integer }
        tables:
          type: array
          items: { $ref: "#/components/schemas/BackupTableCount" }
    BackupInput:
      type: object
      properties:
        note: { type: ["string", "null"] }

    # ------------------------------------------------------------ media
    MediaItem:
      type: object
      required: [id, url, title, alt, type, createdAt]
      properties:
        id: { type: integer }
        url: { type: string }
        title: { type: string }
        alt: { type: ["string", "null"] }
        type: { $ref: "#/components/schemas/MediaType" }
        createdAt: { type: string, format: date-time }
    MediaInput:
      type: object
      required: [url, title]
      properties:
        url: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        alt: { type: ["string", "null"] }
        type: { $ref: "#/components/schemas/MediaType" }
