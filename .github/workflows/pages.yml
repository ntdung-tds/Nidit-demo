name: Deploy NIDIT demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Pages API recovery
        run: pnpm run test:pages

      - name: Build workspace type definitions
        run: pnpm run typecheck:libs

      - name: Typecheck portal
        run: pnpm --filter @workspace/nidit-portal run typecheck

      - name: Build dynamic demo
        run: pnpm --filter @workspace/nidit-portal run build
        env:
          PORT: 4173
          BASE_PATH: /Nidit-demo/
          VITE_GITHUB_PAGES: "true"
          VITE_API_BASE_URL: ${{ vars.NIDIT_API_BASE_URL || 'https://66t9uc18mn3.sisko.replit.dev' }}

      - name: Build IAICT WOW edition
        run: node scripts/build-iaict-wow.mjs

      - name: Enhance IAICT WOW+ depth
        run: node scripts/enhance-iaict-wowplus.mjs

      - name: Apply IAICT production WOW UI
        run: node scripts/enhance-iaict-production-ui.mjs

      - name: Apply Vietnamese typography system
        run: node scripts/enhance-iaict-typography.mjs

      - name: Apply IAICT homepage WOW v2 refinement
        run: node scripts/enhance-iaict-wow-v2.mjs

      - name: Apply IAICT Hero WOW v3
        run: node scripts/enhance-iaict-hero-v3.mjs

      - name: Apply IAICT Project V4 refinement
        run: |
          sed -i 's/PROJECT SPOTLIGHT/IAICT Project Lab · Trâm Rừng/' scripts/enhance-iaict-project-v4.mjs
          node scripts/enhance-iaict-project-v4.mjs

      - name: Build Trâm Rừng case study V5
        run: node scripts/enhance-iaict-tram-rung-v5.mjs

      - name: Apply category landing V6
        run: node scripts/enhance-iaict-category-v6.mjs

      - name: Enrich category cards V6.1
        run: node scripts/enhance-iaict-category-v61.mjs

      - name: Expand category content V6.2
        run: node scripts/enhance-iaict-category-v62.mjs

      - name: Enrich homepage cards V7
        run: node scripts/enhance-iaict-home-v7.mjs

      - name: Balance homepage visual density V7.2
        run: node scripts/enhance-iaict-home-v72.mjs

      - name: Tighten homepage empty blocks V7.3
        run: node scripts/enhance-iaict-home-v73.mjs

      - name: Densify knowledge cards V7.4
        run: node scripts/enhance-iaict-home-v74.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/nidit-portal/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
